name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: Contract suite (real GenVM)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "genlayer-test==0.29.2" "pytest>=8,<9" "genvm-linter==0.11.0"

      # `lint` is the AST-only, offline pass and is what belongs in CI.
      # `genvm_linter.cli check` additionally validates against the SDK over the
      # network and exits 1 on this contract; it is not a substitute here.
      - name: Lint the contract
        run: python -m genvm_linter.cli lint contracts/AgentVault.py

      # conftest.py pins GENVM_VERSION, so a clean runner downloads the same
      # build the suite was written against instead of resolving "latest".
      - name: Run the suite
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm run build
